services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: askwell
      POSTGRES_PASSWORD: askwell
      POSTGRES_DB: askwell
    ports:
      - "5434:5432"  # 5432/5433 are often taken by locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
