# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# The database lives on Neon (Render's free Postgres expires after 30 days).
services:
  - type: web
    name: askwell
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon's pooled connection string (host ends in -pooler)
      - key: DATABASE_URL_UNPOOLED
        sync: false # Neon's direct connection string, used for migrations
      - key: JWT_SECRET
        generateValue: true
      - key: MODERATION_MODEL
        value: claude-haiku-5-5
